
name: CI/CD Pipeline
on:
 pull_request:
    branches:
     - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up nodejs
        uses: actions/setup-node@v2
        with:
          node-version: 22

      - name: Install depedencies
        working-directory: backend
        run: npm install --legacy-peer-deps
        
      - name: Run tests
        working-directory: backend
        run: npm run test


